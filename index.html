<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#111111">
  <title>Welcome to Wonderland Dream | New Story</title>
  <link rel="stylesheet" href="style.css">
  <script src="intro.js" defer></script>
</head>
<body>

  <header class="w-header">
    <div class="w-wrap w-header-inner">
      <div class="w-wordmark">NEW <strong>STORY</strong><small>Make It a Story.</small></div>
      <span class="w-badge">WONDERLAND DREAM</span>
    </div>
  </header>

  <main class="intro-stage">
    <div class="w-wrap" style="display: flex; flex-direction: column; align-items: center;">
      <p class="w-eyebrow">A NEW CHAPTER AWAITS</p>
      <h1>WONDERLAND <span>DREAM</span></h1>

      <!-- Big Centered Video -->
      <div class="big-video-container">
        <video id="intro-video" controls playsinline preload="metadata">
          <source src="assets/videos/intro.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>

      <!-- Animated Button Area -->
      <div class="action-area">
        <button id="help-me-btn" class="help-btn" type="button">
          ✨ Help me!
        </button>

        <!-- Prototype test button so you can test the animation without waiting for a video -->
        <button id="test-trigger" class="dev-skip" type="button">
          [Prototype Test: Simulate Video Ending]
        </button>
      </div>
    </div>
  </main>

  <!-- Big Rules Popup Window -->
  <div id="rules-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="rules-title">
    <div class="rules-window">
      <div class="modal-header">
        <h2 id="rules-title">Before You Begin</h2>
        <button id="close-rules" class="close-modal" type="button" aria-label="Close rules">&times;</button>
      </div>

      <div class="rules-placeholder-body">
        <p style="font-size: 18px; margin-bottom: 6px; font-weight: 700;">Rules Area</p>
        <small style="opacity: 0.75;">(Your game rules and instructions will go right here)</small>
      </div>

      <div class="modal-footer">
        
      </div>
    </div>
  </div>

</body>
</html>
