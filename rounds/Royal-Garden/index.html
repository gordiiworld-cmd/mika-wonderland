<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#2D6A4F">
  <title>Round — Royal Garden | Wonderland Dream</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body class="w-game" data-round="royal-garden">
  <a class="skip" href="#round-content">Skip to challenge</a>
  <header class="w-header game-header"><div class="w-wrap w-header-inner">
    <div class="w-wordmark" aria-label="New Story">NEW <strong>STORY</strong><small>YOU A'IN</small></div>
    <span class="w-round-mark">WONDERLAND DREAM · CHAPTER 06 / 06</span>
  </div></header>
  <main id="round-content">
    <section class="game-intro">
      <div class="w-wrap game-wrap">
        <p class="w-eyebrow">ROUND 6</p>
        <h1>ROYAL <span>GARDEN</span></h1>
       

       
        <div class="w-video-shell" id="round6-video-shell" aria-label="Royal Garden video player">
          <div class="w-video-placeholder" id="garden-video-placeholder">
            <div class="w-play-ring">▶</div>
            <p id="video-caption">ROYAL GARDEN · STORY VIDEO</p>
            <small id="video-help">Once the finished video is added, it will play here.</small>
          </div>
          <video id="garden-video" controls playsinline preload="metadata" aria-label="Royal Garden story video">
            <source src="../../assets/videos/Round6.mp4" type="video/mp4">
            Your browser does not support video playback.
          </video>
          <!-- Only Round 6 controls, overlaid on the existing video shell. -->
          
          <button id="round6-play-with-sound" type="button" class="w-button w-button-main" hidden>▶ PLAY VIDEO WITH SOUND</button>
        </div>

        <div class="w-game-step">
          <span>03</span>
          <div>
            <h2>
              CHOOSE A KEY TO SAVE ALICE!
            </h2>
            <audio id="myTask" src="Task_R6.mpeg"></audio>
              <button class="w-button" id="audio" onclick="playTask()">
                Listen to the Task
              </button>
          </div>
        </div>

        <!-- The original four key silhouettes, without cards or visible button frames. -->
        <div id="rabbit-answer-board" class="round6-key-board" role="group" aria-label="Choose one of four keys">
          <button class="round6-key" type="button" data-key="1" aria-label="Key 1 — diamond">
            <img src="key_base_01.png" alt="Diamond key">
          </button>
          <button class="round6-key" type="button" data-key="2" aria-label="Key 2 — heart">
            <img src="key_base_03.png" alt="Heart key">
          </button>
          <button class="round6-key" type="button" data-key="3" aria-label="Key 3 — club">
            <img src="key_base_02.png" alt="Club key">
          </button>
          <button class="round6-key" type="button" data-key="4" aria-label="Key 4 — spade">
            <img src="key_base_04.png" alt="Spade key">
          </button>
        </div>
        <p id="word-feedback" class="w-feedback" aria-live="polite"></p>
        
        <div class="round6-wake-bottom" aria-live="polite">
          <button id="wake-up-button" type="button" class="w-button w-button-main" hidden>WAKE UP!</button>
            <button id="replay-round6-button" type="button" class="w-button w-button-main" hidden>PLAY AGAIN</button>
        </div>
            
        <p class="w-game-footer">New Story · Wonderland Dream · Royal Garden</p>
      </div>
    </section>
  </main>
</body>
</html>
